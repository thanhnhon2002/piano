<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Piano</title>
<meta name="author" content="ThanhNhon">
<meta name="description" content="Học Piano: luyện đọc nốt nhạc khóa Sol, khóa Fa, hợp âm, luyện nghe và ký hiệu âm nhạc; kết nối được đàn piano điện qua MIDI. Tác giả: ThanhNhon.">
<!--
  Học Piano
  Tác giả: ThanhNhon
  File chạy độc lập, không cần Internet.
  Font ký hiệu âm nhạc: Noto Music (SIL Open Font License 1.1), được nhúng sẵn bên dưới.
  Âm thanh piano: Salamander Grand Piano V3 – Alexander Holm (CC BY 3.0), được nhúng sẵn bên dưới.
-->
<style>
  @font-face {
    font-family: "Noto Music";
    font-style: normal; font-weight: 400; font-display: block;
    src: url(data:font/woff2;base64,__NOTO_MUSIC_WOFF2__) format("woff2");
    unicode-range: U+25CC, U+2669-266F, U+1D000-1D0F5, U+1D100-1D245;
  }
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e;
    --line: #2a2723; --accent: #2f6fde; --good: #1f9d55; --bad: #d64545;
    --border: #e4dfd6; --key-hl: #ffd34d; --dim: #9a948a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --card: #222127; --ink: #f1eee8; --muted: #a39e95;
      --line: #e9e5dd; --accent: #6b9bff; --good: #3ccf7f; --bad: #ff6b6b;
      --border: #34323a; --key-hl: #e0b020; --dim: #77726b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 20px 16px 40px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; text-align: center; }
  .music { font-family: "Noto Music", "Segoe UI Symbol", serif; }

  /* Chọn chế độ */
  .modes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
  @media (max-width: 560px) { .modes { grid-template-columns: repeat(3, 1fr); } }
  .modes button {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 8px 4px; cursor: pointer; font: inherit; font-size: .85rem;
    display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2;
  }
  .modes button .ic { font-size: 1.35rem; height: 1.7rem; display: flex; align-items: center; }
  .modes button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 460px) { .modes button { font-size: .72rem; } }
  .sub { text-align: center; color: var(--muted); margin: 0 0 12px; font-size: .95rem; }

  .settings {
    display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center;
    margin-bottom: 12px; font-size: .95rem;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--card); color: var(--ink); padding: 8px 12px;
    cursor: pointer; font: inherit;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }

  /* Khuông nhạc */
  #staff { width: 100%; height: auto; display: block; }
  #staff .ln { stroke: var(--line); stroke-width: 1.3; }
  #staff .f { fill: var(--line); }
  #staff .s { stroke: var(--line); stroke-width: 1.6; fill: none; }
  #staff .hole { fill: var(--card); }
  #staff .f.hl { fill: var(--accent); }   #staff .s.hl { stroke: var(--accent); }
  #staff .f.good { fill: var(--good); }   #staff .s.good { stroke: var(--good); }
  #staff .f.bad { fill: var(--bad); }     #staff .s.bad { stroke: var(--bad); }
  #staff .f.dim { fill: var(--dim); }     #staff .s.dim { stroke: var(--dim); }
  #staff .lbl { font-size: 12px; text-anchor: middle; fill: var(--muted); font-weight: 600; }
  #staff .lbl.good { fill: var(--good); } #staff .lbl.bad { fill: var(--bad); }

  .result {
    min-height: 96px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; margin: 8px 0 4px; text-align: center;
  }
  .result .big { font-size: 1.8rem; font-weight: 700; }
  .result .small { color: var(--muted); font-size: .95rem; }
  .result .hint { color: var(--muted); }
  .result .desc { margin-top: 6px; font-size: .98rem; line-height: 1.45; max-width: 520px; }
  .ok { color: var(--good); } .no { color: var(--bad); }

  .autobar { width: 160px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .autobar i { display: block; height: 100%; background: var(--accent); animation: autofill linear forwards; }
  @keyframes autofill { from { width: 0; } to { width: 100%; } }
  .timer { display: flex; align-items: center; gap: 10px; padding: 4px 4px 0; font-weight: 700; }
  .timer #tLeft { min-width: 64px; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .timer #tLevel { color: var(--muted); font-weight: 600; font-size: .85rem; white-space: nowrap; }
  .timer .progress { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .timer .progress i { display: block; height: 100%; width: 100%; background: var(--accent); }
  .timer.low #tLeft { color: var(--bad); }
  .timer.low .progress i { background: var(--bad); }
  #noteClef .music { margin-right: 4px; }
  .segwrap { display: inline-flex; align-items: center; gap: 8px; }
  #noteMax button { padding: 8px 11px; }
  .midibar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; margin: -4px 0 12px; font-size: .92rem; }
  .pill { border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 99px;
    padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .pill.on { border-color: var(--good); color: var(--good); }
  .kbsel { display: inline-flex; align-items: center; gap: 6px; }
  .kbsel select { border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 8px;
    padding: 6px 8px; font: inherit; }
  .ledsel select { border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 8px;
    padding: 4px 6px; font: inherit; }
  .midistatus { color: var(--muted); font-size: .85rem; text-align: center; }
  .midistatus.ok { color: var(--good); } .midistatus.bad { color: var(--bad); }
  .accsel { display: flex; justify-content: center; margin-top: 8px; }
  .accsel .seg button { padding: 7px 14px; font-weight: 600; }
  .answers { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0; }
  .answers.sym { grid-template-columns: 1fr 1fr; }
  .answers button {
    padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  .answers button small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
  .answers button.right { background: var(--good); color: #fff; border-color: var(--good); }
  .answers button.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
  .answers button.right small, .answers button.wrong small { color: #fff; }
  .answers button:disabled { cursor: default; }
  .answers button:active:not(:disabled) { transform: scale(.97); }

  .actions { display: flex; gap: 10px; }
  .actions button, .primary {
    flex: 1; padding: 14px; border-radius: 12px; border: 0; font: inherit; font-weight: 600;
    font-size: 1.05rem; cursor: pointer;
  }
  #autoBtn, .primary { background: var(--accent); color: #fff; }
  #autoBtn.off { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
  #nextBtn { background: var(--ink); color: var(--bg); }
  #soundBtn { flex: 0 0 auto; background: var(--card); color: var(--ink); border: 1px solid var(--border); }
  .ghost { background: var(--card) !important; color: var(--ink) !important; border: 1px solid var(--border) !important; }

  #kbd { width: 100%; height: auto; display: block; margin-top: 10px; }

  .stats { display: flex; justify-content: center; gap: 18px; margin: 14px 0 6px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .stats { flex-wrap: wrap; }
  .flame { display: inline-block; margin-left: 3px; transform-origin: 50% 90%; }
  .flame.on { animation: flicker .9s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.12) rotate(4deg); } }

  /* Hiệu ứng khi đạt mốc chuỗi: nằm đè lên trên, không chặn thao tác, không làm xê dịch bố cục */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .burst { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); white-space: nowrap; /* vị trí thật do JS đặt */
    display: flex; align-items: center; gap: 8px; padding: 7px 16px 7px 12px; border-radius: 99px;
    background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--c1);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25), 0 0 0 3px color-mix(in srgb, var(--c1) 22%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: toast 2.6s cubic-bezier(.2, .9, .3, 1.15) forwards; }
  .burst .emoji { font-size: 1.35rem; line-height: 1; animation: spin .7s ease-out; }
  .burst .word { font-size: 1.15rem; font-weight: 900; letter-spacing: .03em; line-height: 1;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c1)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.2s linear infinite; }
  .burst .sub { font-size: 1.05rem; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 12px) scale(.85); }
    9% { opacity: 1; transform: translate(-50%, 0) scale(1.06); }
    16% { transform: translate(-50%, 0) scale(1); }      /* ~0,4 giây hiện lên */
    85% { opacity: 1; transform: translate(-50%, 0) scale(1); } /* đứng yên ~1,8 giây */
    100% { opacity: 0; transform: translate(-50%, -14px) scale(.96); }
  }
  @keyframes shine { to { background-position: 200% 0; } }
  @keyframes spin { 0% { transform: scale(.6) rotate(-90deg); } 60% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .burst, .burst .word, .burst .emoji, .flame.on { animation-duration: .01s; } }
  .stats .best b { color: var(--key-hl); }
  .stats .best.timed b { color: var(--bad); } /* chữ màu thường, chỉ con số màu đỏ */
  .stats .sic { font-size: 1.35em; vertical-align: -0.12em; display: inline-block; }
  .stats .best.new .sic { animation: pop .6s ease; }
  .stats .best.new { color: var(--good); animation: pop .6s ease; }
  .stats .best.new b, .stats .best.timed.new, .stats .best.timed.new b { color: var(--good); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  /* Luyện ngón & Bài hát */
  #staff .fing { font-size: 13px; font-weight: 800; text-anchor: middle; fill: var(--muted); }
  #staff .fing.hl { fill: var(--accent); font-size: 15px; } #staff .fing.good { fill: var(--good); } #staff .fing.bad { fill: var(--bad); }
  #staff .mov, #staff .playhead.mv { transition: transform .3s ease; }
  #staff .playhead { fill: var(--accent); opacity: .12; }
  #staff g.n.hl .f { fill: var(--accent); } #staff g.n.hl .s { stroke: var(--accent); }
  #staff g.n.good .f { fill: var(--good); } #staff g.n.good .s { stroke: var(--good); }
  #staff g.n.bad .f { fill: var(--bad); } #staff g.n.bad .s { stroke: var(--bad); }
  #staff g.n.hl .fing { fill: var(--accent); font-size: 15px; } #staff g.n.good .fing, #staff g.n.good .lbl { fill: var(--good); }
  #staff g.n.bad .fing, #staff g.n.bad .lbl { fill: var(--bad); } #staff g.n.hl .lbl { fill: var(--accent); }
  @media (prefers-reduced-motion: reduce) { #staff .mov, #staff .playhead.mv { transition: none; } }
  #kbd.play rect { cursor: pointer; } #kbd text { pointer-events: none; }
  #restartBtn { flex: 0 0 auto; background: var(--card); color: var(--ink); border: 1px solid var(--border); }
  #pieceSel { max-width: 260px; }
  @media (max-width: 480px) { .actions .t { display: none; } }
  .result .big .fn { color: var(--accent); }
  .keys-hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }
  .author { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
  .author b { color: var(--ink); }
  .appname { white-space: nowrap; }
  .visitors { font-size: .62em; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .visitors[hidden] { display: none !important; }
  @media (max-width: 480px) { .visitors { display: block; margin-top: 2px; } .visitors .sep { display: none; } }
  .credits { font-size: .72rem; margin-top: 4px; opacity: .8; }
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"><canvas id="fxCanvas"></canvas></div>
<div class="app">
  <h1><span class="appname">🎹 Học Piano</span><span class="visitors" id="visitors" hidden></span></h1>

  <nav class="modes" id="modes"></nav>
  <div class="midibar" id="midiBar">
    <button class="pill" id="midiBtn">🎹 Kết nối đàn (MIDI)</button>
    <label class="kbsel">Bàn phím: <select id="kbSize"></select></label>
    <span class="midistatus" id="midiStatus"></span>
  </div>

  <div class="settings" id="noteOpts">
    <span class="chk ledsel" id="optLedger">Dòng kẻ phụ: <select id="ledger" title="Số dòng kẻ phụ phía trên và phía dưới khuông"></select></span>
    <label class="chk" id="optOtt" title="Nốt cần từ 4 dòng kẻ phụ trở lên được viết gọn bằng ký hiệu quãng tám"><input type="checkbox" id="ottava" checked> Dùng 8va/8vb</label>
    <label class="chk" id="optAcc" title="Thăng ♯, giáng ♭, bình ♮, hóa biểu đầu khuông và dấu hóa đánh lừa"><input type="checkbox" id="acc"> Dấu hóa ♯ ♭ ♮</label>
    <label class="chk" id="optTimer"><input type="checkbox" id="timer"> ⏱ Đếm giờ</label>
    <label class="chk" id="optSound"><input type="checkbox" id="autoSound" checked> Phát âm thanh</label>
  </div>
  <div class="settings" id="noteClefOpts">
    <div class="seg" id="noteClef">
      <button data-v="treble"><span class="music">𝄞</span>Khóa Sol</button><button data-v="bass"><span class="music">𝄢</span>Khóa Fa</button><button data-v="both"><span class="music">𝄞𝄢</span>Hai khóa</button>
    </div>
    <span class="segwrap">Tối đa:
      <span class="seg" id="noteMax">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
      </span> nốt
    </span>
  </div>
  <div class="settings" id="chordOpts">
    <div class="seg" id="chordClef">
      <button data-v="treble">Khóa Sol</button><button data-v="bass">Khóa Fa</button><button data-v="both">Cả hai</button>
    </div>
    <div class="seg" id="chordLevel">
      <button data-v="1">Trưởng · Thứ</button><button data-v="2">+ Giảm · Tăng</button><button data-v="3">+ Hợp âm 7</button>
    </div>
    <label class="chk"><input type="checkbox" id="inv"> Thể đảo</label>
  </div>

  <div class="settings" id="practiceOpts">
    <label class="kbsel">Bài: <select id="pieceSel"></select></label>
    <div class="seg" id="handSeg"><button data-v="rh">Tay phải</button><button data-v="lh">Tay trái</button><button data-v="both">Hai tay</button></div>
    <label class="chk" title="Tô sáng phím cần bấm và số ngón trên bàn phím"><input type="checkbox" id="pracHint" checked> Gợi ý phím</label>
    <label class="chk"><input type="checkbox" id="pracNames"> Tên nốt</label>
  </div>
  <div class="card">
    <div class="timer" id="timerBox">
      <span id="tLeft">20.0s</span>
      <div class="progress"><i id="tFill"></i></div>
      <span id="tLevel"></span>
    </div>
    <svg id="staff" viewBox="0 0 360 215" role="img" aria-label="Khuông nhạc"></svg>

    <div class="result" id="result"></div>
    <div class="accsel" id="accSel"><div class="seg" id="accSeg"></div></div>
    <div class="answers" id="answers"></div>

    <div class="actions" id="actions">
      <button id="autoBtn" title="Bật/tắt tự chuyển sang câu tiếp (phím Space)"></button>
      <button id="restartBtn" title="Chơi lại từ đầu (phím R)">↺<span class="t"> Chơi lại</span></button>
      <button id="soundBtn" title="Nghe lại">🔊</button>
      <button id="nextBtn">Tiếp →</button>
    </div>
    <svg id="kbd" viewBox="0 0 580 80" aria-label="Bàn phím piano"></svg>
  </div>

  <div class="stats" id="stats">
    <span title="Số câu đúng liên tiếp hiện tại">Điểm hiện tại: <b id="sStreak">0</b><span class="flame" id="sFlame"></span></span>
    <span class="best" id="sBestWrap" title="Điểm cao nhất khi không đếm giờ (lưu trên máy bạn, riêng từng chế độ)"><span class="lbl"><span class="sic">🏆</span> Kỷ lục thường: </span><b id="sBest">0</b></span>
    <span class="best timed" id="sBestTWrap" title="Điểm cao nhất khi bật đếm giờ (lưu trên máy bạn, riêng từng chế độ)"><span class="lbl"><span class="sic">⚡</span> Kỷ lục đếm giờ: </span><b id="sBestT">0</b></span>
  </div>
  <div class="keys-hint" id="hint"></div>
  <footer class="author">Tác giả: <b>ThanhNhon</b>
    <div class="credits">Âm thanh: Salamander Grand Piano – Alexander Holm (CC BY 3.0) · Font: Noto Music (SIL OFL 1.1)</div>
  </footer>
</div>

<script>
// ===================== Hằng số & tiện ích =====================
const SOLFEGE = ["Đô", "Rê", "Mi", "Fa", "Sol", "La", "Si"];
const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const SEMI = [0, 2, 4, 5, 7, 9, 11];
const LETTER_KEY = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };

// Chỉ số nốt (diatonic): quãng tám*7 + vị trí chữ (C4 = 28)
const CLEFS = {
  treble: { bottom: 30 /*dòng 1 = Mi4 (E4)*/ },
  bass:   { bottom: 18 /*dòng 1 = Sol2 (G2)*/ },
};
const T = "treble", B = "bass";

const S = 14;               // khoảng cách giữa 2 dòng kẻ
const TOP = 70;             // y dòng kẻ trên cùng
const BOTTOM = TOP + 4 * S; // y dòng kẻ dưới cùng
const X0 = 16, X1 = 344, NOTE_X = 215;
const MUSIC_FONT = '"Noto Music", "Segoe UI Symbol", "Bravura", serif';
const SERIF_FONT = '"Times New Roman", Georgia, serif';

// Tab "Học nốt" gồm 3 lựa chọn khóa; state.mode là "treble" | "bass" | "both"
const NOTE_CLEFS = {
  treble: "Nhìn nốt trên khóa Sol và chọn tên nốt đúng.",
  bass: "Nhìn nốt trên khóa Fa và chọn tên nốt đúng.",
  both: "Khóa Sol và khóa Fa xuất hiện ngẫu nhiên xen kẽ.",
};
const MODES = [
  { id: "note", ic: "𝄞𝄢", music: true, label: "Học nốt", desc: "" },
  { id: "chord", ic: "♬", music: true, label: "Hợp âm",
    desc: "Nhận biết hợp âm trên khuông nhạc: trưởng, thứ, giảm, tăng, hợp âm 7 và các thể đảo." },
  { id: "ear", ic: "🎧", label: "Luyện nghe",
    desc: "Nghe nốt Đô chuẩn, rồi nghe nốt bí ẩn và đoán xem đó là nốt gì." },
  { id: "sym", ic: "♯", music: true, label: "Ký hiệu",
    desc: "Nhận biết ký hiệu được tô màu xanh và chức năng của nó." },
  { id: "finger", ic: "🖐", label: "Luyện ngón", desc: "Bài tập 5 ngón, gam, hợp âm rải với số ngón gợi ý." },

// Các cỡ bàn phím phổ biến: [số phím, nốt thấp nhất, nốt cao nhất] (số MIDI, Đô giữa C4 = 60)
const KB_SIZES = {
  auto: { label: "Tự động (vừa đủ cho app)", lo: 31, hi: 88 }, // tối thiểu G1–E6, tự mở rộng theo số dòng kẻ phụ

  61: { label: "61 phím (C2–C7)", lo: 36, hi: 96 },
  73: { label: "73 phím (E1–E7)", lo: 28, hi: 100 },
  76: { label: "76 phím (E1–G7)", lo: 28, hi: 103 },
  88: { label: "88 phím (A0–C8)", lo: 21, hi: 108 },

let kbSize = String(lsGet("kbSize", "auto"));

function drawKeyboard(hlMidis, o = null) {
  const svg = $("kbd"); svg.innerHTML = "";
  state.kbdHl = hlMidis; state.kbdOpts = o;
  const hl = new Set(hlMidis == null ? [] : [].concat(hlMidis));

  const fillB = m => bad.has(m) ? "var(--bad)" : hl.has(m) ? "var(--key-hl)" : held.has(m) ? "var(--accent)" : "#222";

    const k = ledgerCount();

    el("rect", { x: i * w, y: 0, width: w, height: h, rx: Math.min(2, w / 4), "data-m": m,
      style: `fill:${fillW(m)};stroke:#555;stroke-width:${w < 9 ? 0.6 : 1}` }, svg);
    if (m % 12 === 0)
      el("text", { x: i * w + w / 2, y: h - 5, "text-anchor": "middle", "font-size": fs, fill: "#888" }, svg)
        .textContent = "C" + (m / 12 - 1);

  for (let m = lo + 1; m < hi; m++) {
    if (isWhite(m)) continue;

    el("rect", { x: x - w * 0.3, y: 0, width: w * 0.6, height: h * 0.6, rx: Math.min(1.5, w / 6), "data-m": m,
      style: `fill:${fillB(m)};stroke:#222;stroke-width:${w < 9 ? 0.5 : 1}` }, svg);

// midi -> MP3 base64; được build.py nhúng vào. Nếu trống thì dùng âm tổng hợp.
const PIANO_SAMPLES = {/*__PIANO_SAMPLES__*/};
let actx, pianoBufs = null, pianoLoad = null;
function audio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();

}
function loadPiano() {
  if (pianoLoad) return pianoLoad;
  const c = audio(), entries = Object.entries(PIANO_SAMPLES);

    const bin = atob(b64), u = new Uint8Array(bin.length);

  })).then(arr => { pianoBufs = arr.length ? arr : null; }).catch(() => { pianoBufs = null; });

}

async function playSeq(list) {
  try {
    const c = audio(); await loadPiano();
    const t0 = c.currentTime + 0.03;
    list.forEach(([m, dl]) => (pianoBufs ? sampleNote : synthNote)(c, m, t0 + dl));
  } catch (e) {}
}

function sampleNote(c, midi, t) {
  let best = pianoBufs[0];

  const src = c.createBufferSource(), g = c.createGain();

  g.gain.setValueAtTime(1, t);
  g.gain.setValueAtTime(1, t + 1.6);

  master.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
  master.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);

          && !(a === 1 && state.key < 0) && !(a === -1 && state.key > 0)
          && !(a === 1 && (li === 2 || li === 6)) && !(a === -1 && (li === 0 || li === 3)));
        r.acc = opts.length ? opts[rnd(opts.length)] : k;
      }
    }
    state.notes.push({ d: r.d, acc: r.acc, ans: null });
    avoid = r;
  }
  // Dấu hóa phải ghi: dấu trước một nốt còn hiệu lực cho các nốt cùng vị trí phía sau trên khuông
  const inEffect = {};
  state.notes.forEach(it => {
    const base = it.d in inEffect ? inEffect[it.d] : keyAcc[it.d % 7];
    if (adv) it.sign = it.acc !== base ? it.acc : (Math.random() < 0.2 ? it.acc : null); // 20%: dấu thừa "đánh lừa"
    else it.sign = it.acc !== 0 ? it.acc : (base !== 0 ? 0 : null);
    inEffect[it.d] = it.acc;
  });
  state.idx = 0; state.revealed = false; state.flash = false; clearAuto();
  $("result").innerHTML = (count === 1
    ? '<span class="hint">Nốt này là nốt gì?</span>'
    : `<span class="hint">Đọc lần lượt ${count} nốt từ trái sang phải</span>`) +
    (adv ? '<span class="hint" style="font-size:.85rem">Nhớ để ý hóa biểu đầu khuông và dấu bình ♮</span>' : "");
  resetAnswerButtons();
  renderNote(); drawKeyboard(null);
  startQTimer();
}
const noteMidis = () => state.notes.map(it => midiOf(it.d, it.acc));
const playNotes = () => playSeq(noteMidis().map((m, i) => [m, i * 0.4]));

// Bấm một đáp án: 1 nốt thì hiện kết quả ngay; nhiều nốt thì ghi nhận rồi sang nốt kế tiếp
function answerNote(g) {
  if (state.revealed || state.phase !== "note") return;
  if (state.notes.length === 1) return revealNote(g);
  const it = state.notes[state.idx];
  // luôn phát âm của nốt đúng (trừ khi đã bấm đúng phím trên đàn MIDI: đàn tự phát rồi)
  if ($("autoSound").checked && !(g.midi != null && g.ok)) play(midiOf(it.d, it.acc));
  const right = noteRight({ ...it, ans: g });
  const b = $("answers").children[g.li];
  b.className = right ? "right" : "wrong";
  setTimeout(() => { if (!state.revealed) b.className = ""; }, 250);
  setAccSel(0);
  clearTimeout(state.flashT);
  if (!right) { // sai: ghi nhận lần chọn sai đầu tiên (để chấm điểm), nốt nháy đỏ rồi cho chọn lại
    if (!it.ans) it.ans = g;
    state.flash = true; renderNote();
    state.flashT = setTimeout(() => { state.flash = false; if (!state.revealed && state.phase === "note") renderNote(); }, 400);
    return;
  }
  if (!it.ans) it.ans = g; // đúng ngay lần đầu
  it.done = true;
  state.flash = false;
  state.idx++;
  if (state.idx >= state.notes.length) revealNote();
  else renderNote();
}
function revealNote(guess, timeout) {
  if (state.revealed) return;
  state.revealed = true;
  stopQTimer();
  const notes = state.notes, n = notes.length;
  if (n === 1 && guess) notes[0].ans = guess;
  let good = 0;
  notes.forEach(it => {
    if (it.ans) { const ok = noteRight(it); score(ok); if (ok) good++; }
    else if (timeout) score(false);
  });
  const allRight = good === n, answered = notes.some(it => it.ans);

  if (timerOn()) {
    const left = Math.max(0, (state.tEnd - performance.now()) / 1000);
    if (allRight && state.tLimit > T_MIN) {
      state.tLimit = Math.max(T_MIN, state.tLimit - T_STEP);
      renderTimer(left, `Tiếp theo: ${fmtSec(state.tLimit)}/nốt ⬇`);
    } else if (allRight) {
      renderTimer(left, "Mức nhanh nhất: 1s/nốt 🔥");
    } else if (answered || timeout) { // sai hoặc hết giờ: quay về mức đầu (T_MAX)
      const was = state.tLimit;
      state.tLimit = T_MAX;
      renderTimer(left, was < T_MAX ? `Sai: về lại ${fmtSec(T_MAX)}/nốt ↺` : undefined);
    }
  }

  const clefTxt = (state.clef === T ? "khóa Sol" : "khóa Fa") + (accLevel() === 2 ? " · Hóa biểu: " + keyDesc(state.key) : "");
  if (n === 1) {
    const it = notes[0], nm = nameOf(it.d, it.acc), right = noteRight(it);
    const verdict = guess ? (right ? '<span class="ok">✔ Chính xác!</span> ' : '<span class="no">✘ Chưa đúng.</span> ')
      : timeout ? '<span class="no">⏰ Hết giờ!</span> ' : "";
    $("result").innerHTML = `<div class="big">${verdict}${nm.vi} <span class="small">(${nm.en})</span></div>` +
      `<div class="small">${clefTxt}${guess && !right ? ` · bạn chọn ${label(guess)}` : ""}</div>`;
    setAccSel(it.acc);
    markAnswers(nm.li, guess, right);
  } else {
    const head = timeout ? '<span class="no">⏰ Hết giờ!</span> '
      : allRight ? '<span class="ok">✔ Đúng hết!</span> ' : "";
    const names = notes.map(it => `<span class="${noteRight(it) ? "ok" : "no"}">${nameOf(it.d, it.acc).vi}</span>`).join(" – ");
    $("result").innerHTML = `<div class="big">${head}${good}/${n} <span class="small">nốt đúng</span></div>` +
      `<div class="small">${names} · ${clefTxt}</div>`;
    document.querySelectorAll("#answers button").forEach(b => { b.className = ""; b.disabled = true; });
    setAccSel(0);
  }
  renderNote(); drawKeyboard(noteMidis());
  // 1 nốt: phát nốt đó. Nhiều nốt: từng nốt đã phát khi chọn, chỉ phát lại cả khuông khi hết giờ
  const pianoRight = n === 1 && guess && guess.midi != null && guess.ok;
  if ($("autoSound").checked && (n === 1 || timeout) && !pianoRight) playNotes();
  scheduleAuto(newNote, allRight ? AUTO_MS : 2500); // sai / hết giờ: chờ 2,5 giây để xem đáp án
}

// ===================== Chế độ luyện nghe =====================
// Phát 1 nốt (lặp 3 lần, cách nhau 1 giây) trong 7 nốt Đô4 → Si4; chọn đúng tên nốt.
// Bấm trên đàn MIDI thì phải đúng chính xác phím.
const EAR_LO = 28, EAR_HI = 34; // Đô4 → Si4
const EAR_REPEAT = 3, EAR_GAP = 1;
function newEar() {
  const prev = state.ear; let d;
  do { d = EAR_LO + rnd(EAR_HI - EAR_LO + 1); } while (prev && d === prev.d);
  state.ear = { d, acc: 0, revealed: false }; clearAuto();
  $("result").innerHTML = '<span class="hint">🎧 Nghe và đoán nốt · bấm 🔊 để nghe lại</span>';
  resetAnswerButtons();
  renderEar(); drawKeyboard(null);
  playEar();
}
function playEar() {
  const e = state.ear; if (!e) return;
  const m = midiOf(e.d, e.acc);
  playSeq(Array.from({ length: EAR_REPEAT }, (_, i) => [m, i * EAR_GAP]));
}
function renderEar() {
  const svg = $("staff"), e = state.ear; svg.innerHTML = "";
  drawLines(svg); drawClef(svg, T);
  if (e.revealed) drawNote(svg, NOTE_X, e.d, T, { cls: "good", acc: e.acc });
  else el("text", { x: NOTE_X, y: TOP + 2 * S + 16, "text-anchor": "middle", "font-size": 46, "font-weight": 800, class: "f hl" }, svg).textContent = "?";
}
function revealEar(guess) {
  const e = state.ear; if (!e || e.revealed) return;
  e.revealed = true;
  const target = midiOf(e.d, e.acc), n = nameOf(e.d, e.acc);
  if (guess && guess.midi == null) guess = { li: guess.li, acc: 0 }; // nút trên màn hình: chỉ 7 nốt tự nhiên
  let verdict = "", right = false;
  if (guess) {
    right = guess.ok !== undefined ? guess.ok : guess.li === e.d % 7; // đàn MIDI: phải đúng phím
    score(right);
    verdict = right ? '<span class="ok">✔ Chính xác!</span> ' : '<span class="no">✘ Chưa đúng.</span> ';
  }
  $("result").innerHTML = `<div class="big">${verdict}${n.vi}</div>` +
    `<div class="small">${n.en}${guess && !right ? ` · bạn chọn ${label(guess)}` : ""}</div>`;
  markAnswers(n.li, guess, right);
  renderEar(); drawKeyboard(target);
  if (!(guess && guess.midi != null && right)) play(target); // bấm đúng trên đàn thì đàn đã tự kêu
  scheduleAuto(newEar, 2000);
}

// ===================== Chế độ hợp âm =====================
const QUALITIES = [
  { id: "maj", vi: "trưởng", sym: "", iv: [0, 4, 7], lvl: 1,
    desc: "Hợp âm trưởng = nốt gốc + quãng 3 trưởng (4 nửa cung) + quãng 5 đúng (7 nửa cung). Âm sắc tươi sáng, vui." },
  { id: "min", vi: "thứ", sym: "m", iv: [0, 3, 7], lvl: 1,
    desc: "Hợp âm thứ = nốt gốc + quãng 3 thứ (3 nửa cung) + quãng 5 đúng (7 nửa cung). Âm sắc buồn, dịu." },
  { id: "dim", vi: "giảm", sym: "dim", iv: [0, 3, 6], lvl: 2,
    desc: "Hợp âm giảm = nốt gốc + quãng 3 thứ (3 nửa cung) + quãng 5 giảm (6 nửa cung). Âm sắc căng thẳng, bất ổn." },
  { id: "aug", vi: "tăng", sym: "aug", iv: [0, 4, 8], lvl: 2,
    desc: "Hợp âm tăng = nốt gốc + quãng 3 trưởng (4 nửa cung) + quãng 5 tăng (8 nửa cung). Âm sắc lơ lửng, huyền ảo." },
  { id: "dom7", vi: "bảy", sym: "7", iv: [0, 4, 7, 10], lvl: 3,
    desc: "Hợp âm 7 (át) = hợp âm trưởng + quãng 7 thứ (10 nửa cung). Tạo cảm giác chờ đợi, muốn chuyển về hợp âm chủ." },
  { id: "maj7", vi: "bảy trưởng", sym: "maj7", iv: [0, 4, 7, 11], lvl: 3,
    desc: "Hợp âm 7 trưởng = hợp âm trưởng + quãng 7 trưởng (11 nửa cung). Âm sắc mềm mại, mơ màng (hay gặp trong jazz, pop)." },
  { id: "m7", vi: "thứ bảy", sym: "m7", iv: [0, 3, 7, 10], lvl: 3,
    desc: "Hợp âm 7 thứ = hợp âm thứ + quãng 7 thứ (10 nửa cung). Âm sắc êm, buồn nhẹ." },

const INV_NAMES = ["Thế gốc", "Thể đảo 1", "Thể đảo 2", "Thể đảo 3"];
let chordCfg = Object.assign({ clef: "treble", level: 1, inv: false }, lsGet("chordCfg", {}));

// Xếp chồng quãng 3 từ nốt gốc; trả về null nếu cần dấu hóa kép (hoặc cần ♯♭ khi đang tắt thăng/giáng)
function buildChord(d, acc, q) {
  const root = midiOf(d, acc), tones = [];
  for (let k = 0; k < q.iv.length; k++) {
    const dd = d + 2 * k, a = root + q.iv[k] - midiOf(dd);
    if (Math.abs(a) > 1 || (!accOn() && a !== 0)) return null;
    tones.push({ d: dd, acc: a });
  }
  return tones;
}
function chordPool() {
  const pool = [];
  for (let li = 0; li < 7; li++) {
    const accs = accOn() ? [-1, 0, 1].filter(a => !(a === 1 && (li === 2 || li === 6)) && !(a === -1 && (li === 0 || li === 3))) : [0];
    for (const acc of accs) for (const q of QUALITIES) {
      if (q.lvl > chordCfg.level) continue;
      const tones = buildChord(28 + li, acc, q);
      if (!tones) continue;
      const root = SOLFEGE[li] + ACC_SYM[acc];
      pool.push({ li, acc, q, tones, name: `${root} ${q.vi}`, symbol: LETTERS[li] + ACC_SYM[acc] + q.sym,
        pcs: tones.map(t => midiOf(t.d, t.acc) % 12) });
    }
  }
  return pool;
}
function setupSeg(id, value, onChange) {
  const btns = $(id).querySelectorAll("button");
  const mark = v => btns.forEach(b => b.classList.toggle("on", b.dataset.v === String(v)));
  mark(value);
  btns.forEach(b => b.onclick = () => { mark(b.dataset.v); onChange(b.dataset.v); });
}
function initChordOpts() {
  const save = () => lsSet("chordCfg", chordCfg);
  setupSeg("chordClef", chordCfg.clef, v => { chordCfg.clef = v; save(); newChord(); });
  setupSeg("chordLevel", chordCfg.level, v => { chordCfg.level = +v; save(); newChord(); });
  $("inv").checked = chordCfg.inv;
  $("inv").onchange = () => { chordCfg.inv = $("inv").checked; save(); newChord(); };
}

function newChord() {
  clearAuto();
  const pool = chordPool(), prev = state.chord;
  let c;
  do { c = pool[rnd(pool.length)]; } while (pool.length > 1 && prev && c.name === prev.c.name);
  const clef = chordCfg.clef === "both" ? (Math.random() < 0.5 ? T : B) : chordCfg.clef;
  const shift = (clef === T ? 28 : 21) - 28; // gốc ở quãng 4 (khóa Sol) hoặc quãng 3 (khóa Fa)
  let tones = c.tones.map(t => ({ d: t.d + shift, acc: t.acc }));
  const inv = chordCfg.inv ? rnd(tones.length) : 0;
  for (let i = 0; i < inv; i++) tones[i] = { d: tones[i].d + 7, acc: tones[i].acc };
  tones.sort((a, b) => a.d - b.d);
  const top = CLEFS[clef].bottom + 8;
  if (tones[tones.length - 1].d > top + 4) tones = tones.map(t => ({ d: t.d - 7, acc: t.acc }));

  // Đáp án nhiễu: cùng nốt gốc khác loại, hợp âm có chung ≥2 nốt, rồi ngẫu nhiên
  const others = pool.filter(x => x.name !== c.name);
  const sameRoot = shuffle(others.filter(x => x.li === c.li && x.acc === c.acc));
  const shared = shuffle(others.filter(x => x.pcs.filter(p => c.pcs.includes(p)).length >= 2));
  const picks = [];
  for (const x of [...sameRoot.slice(0, 1), ...shared.slice(0, 2), ...shuffle(others)])
    if (picks.length < 3 && !picks.includes(x)) picks.push(x);
  const choices = shuffle([c, ...picks]);

  state.chord = { c, tones, inv, clef, choices, revealed: false };
  const box = $("answers"); box.className = "answers sym"; box.innerHTML = "";
  choices.forEach((x, i) => {
    const b = document.createElement("button");
    b.innerHTML = `${x.name} <small>${x.symbol}</small>`;
    b.onclick = () => revealChord(i);
    box.appendChild(b);
  });
  $("result").innerHTML = '<span class="hint">Đây là hợp âm gì?</span>';
  renderChord(); drawKeyboard(null);
}
function drawChordNotes(svg, x, tones, clef, cls) {
  const ts = [...tones].sort((a, b) => a.d - b.d);
  let prevD = -99, prevShift = false;
  ts.forEach(t => { // 2 nốt cách nhau quãng 2 thì đầu nốt trên dịch sang phải
    const shift = t.d - prevD === 1 && !prevShift;
    drawNote(svg, x + (shift ? S * 1.6 : 0), t.d, clef, { type: "whole", cls });
    prevShift = shift; prevD = t.d;
  });
  const cols = []; // dấu hóa xếp thành cột để không chồng lên nhau
  [...ts].reverse().filter(t => t.acc).forEach(t => {
    let c = 0;
    while ((cols[c] || []).some(d => Math.abs(d - t.d) < 6)) c++;
    (cols[c] = cols[c] || []).push(t.d);
    const y = yOf(t.d, clef), ax = x - S * 1.8 - c * 12;
    glyph(svg, t.acc === 1 ? "♯" : "♭", t.acc === -1
      ? { cx: ax + 2, top: y - 1.75 * S, bottom: y + 0.5 * S }
      : { cx: ax, top: y - 1.45 * S, bottom: y + 1.45 * S }, cls);
  });
}
function renderChord() {
  const svg = $("staff"), st = state.chord; svg.innerHTML = "";
  drawLines(svg); drawClef(svg, st.clef);
  drawChordNotes(svg, NOTE_X, st.tones, st.clef, st.revealed ? "good" : "");
  if (st.revealed)
    el("text", { x: NOTE_X, y: 28, "text-anchor": "middle", "font-size": 20, "font-weight": 800, class: "f good" }, svg).textContent = st.c.symbol;
}
const chordMidis = () => state.chord.tones.map(t => midiOf(t.d, t.acc)).sort((a, b) => a - b);
function playChord() {
  if (!state.chord) return;
  const ms = chordMidis(), gap = 0.28;
  playSeq([...ms.map((m, i) => [m, i * gap]), ...ms.map(m => [m, ms.length * gap + 0.25])]);
}
function revealChord(guess, pressed) {
  const st = state.chord; if (!st || st.revealed) return;
  st.revealed = true;
  const right = st.choices.indexOf(st.c);
  let verdict = "";
  if (guess !== undefined) {
    score(guess === right);
    verdict = guess === right ? '<span class="ok">✔</span> ' : '<span class="no">✘</span> ';
  }
  const notes = st.c.tones.map(t => SOLFEGE[t.d % 7] + ACC_SYM[t.acc]).join(" – ");
  const low = st.tones[0];
  const invTxt = st.inv ? `${INV_NAMES[st.inv]}: nốt ${SOLFEGE[low.d % 7] + ACC_SYM[low.acc]} ở dưới cùng` : "Thế gốc: nốt gốc ở dưới cùng";
  $("result").innerHTML = `<div class="big">${verdict}${st.c.name} <span class="small">(${st.c.symbol})</span></div>` +
    `<div class="small">Các nốt: <b>${notes}</b> · ${invTxt}</div>` +
    (pressed && guess !== right ? `<div class="small no">Bạn bấm: ${pressed.map(m => label(spellMidi(m, 1))).join(" – ")}</div>` : "") +
    `<div class="desc">${st.c.q.desc}</div>`;
  [...$("answers").children].forEach((b, i) => {
    b.disabled = true;
    if (i === right) b.className = "right"; else if (i === guess) b.className = "wrong";
  });
  renderChord(); drawKeyboard(chordMidis());
  if ($("autoSound").checked && !(pressed && guess === right)) playChord();
  scheduleAuto(newChord, 3000);
}

let symBag = [];

function newSymbol() {
  clearAuto();
  if (!symBag.length) symBag = shuffle(SYMBOLS.map((_, i) => i));
  let idx = symBag.pop();
  if (state.sym && idx === state.sym.idx && symBag.length) { symBag.unshift(idx); idx = symBag.pop(); }
  const item = SYMBOLS[idx];
  const same = shuffle(SYMBOLS.filter(x => x !== item && x.cat === item.cat));
  const other = shuffle(SYMBOLS.filter(x => x.cat !== item.cat));
  const choices = shuffle([item, ...[...same.slice(0, 2), ...other].slice(0, 3)]);
  state.sym = { idx, item, choices, revealed: false };
  const box = $("answers"); box.className = "answers sym"; box.innerHTML = "";
  choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = c.name; b.onclick = () => revealSym(i);
    box.appendChild(b);
  });
  $("result").innerHTML = '<span class="hint">Ký hiệu màu xanh là gì?</span>';
  renderSym();
}
function renderSym() { const svg = $("staff"); svg.innerHTML = ""; state.sym.item.draw(svg); }
function revealSym(guess) {
  const st = state.sym; if (!st || st.revealed) return;
  st.revealed = true;
  const right = st.choices.indexOf(st.item);
  let verdict = "";
  if (guess !== undefined) {
    score(guess === right);
    verdict = guess === right ? '<span class="ok">✔</span> ' : '<span class="no">✘</span> ';
  }
  $("result").innerHTML = `<div class="big">${verdict}${st.item.name}</div><div class="desc">${st.item.desc}</div>`;
  [...$("answers").children].forEach((b, i) => {
    b.disabled = true;
    if (i === right) b.className = "right"; else if (i === guess) b.className = "wrong";
  });
  scheduleAuto(newSymbol, 4000);
}

// Chơi kiểu "chờ": nốt hiện tại tô xanh, bấm đúng phím mới sang nốt kế tiếp.
// Cách ghi nốt: "E4/q:3" = Mi4, nốt đen, ngón 3. Trường độ: w tròn, h trắng, q đen, e móc đơn; thêm "." = có chấm.
// "F#4" thăng, "Bb4" giáng; "|" = vạch nhịp. Ngón: 1 = ngón cái … 5 = ngón út.
const DUR = { w: [4, "whole"], h: [2, "half"], q: [1, "quarter"], e: [0.5, "eighth"] };
function parseMusic(src) {
  const out = [];
  src.trim().split("|").forEach((barSrc, bar) => barSrc.trim().split(/\s+/).filter(Boolean).forEach(tok => {
    const r = tok.match(/^R\/([whqe])(\.?)$/); // dấu lặng
    if (r) { const [beats, type] = DUR[r[1]]; out.push({ rest: true, type, dot: !!r[2], beats: beats * (r[2] ? 1.5 : 1), bar }); return; }
    const m = tok.match(/^([A-G])([#b]?)(\d)\/([whqe])(\.?)(?::(\d))?$/);
    if (!m) throw new Error("Nốt ghi sai: " + tok);
    const d = +m[3] * 7 + LETTERS.indexOf(m[1]), acc = m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0;
    const [beats, type] = DUR[m[4]];
    out.push({ d, acc, midi: midiOf(d, acc), type, dot: !!m[5], beats: beats * (m[5] ? 1.5 : 1), fing: +m[6] || 0, bar });
  }));
  return out;
}
// Tạo chuỗi nốt từ danh sách tên nốt + chuỗi số ngón; mỗi perBar nốt một ô nhịp, nốt cuối dùng lastDur
function mk(notes, fings, dur = "q", perBar = 4, lastDur = "w") {
  const ns = typeof notes === "string" ? notes.split(" ") : notes, fs = String(fings).split("");
  return ns.map((n, i) => {
    const last = i === ns.length - 1;
    return `${n}/${last ? lastDur : dur}:${fs[i]}` + (!last && (i + 1) % perBar === 0 ? " |" : "");
  }).join(" ");
}
const upDown = (ns, fs) => { const n = ns.split(" "), f = fs.split(""); return [n.concat(n.slice(0, -1).reverse()), f.concat(f.slice(0, -1).reverse()).join("")]; };

function hanon(startD, groups, fings, last) {

  ns.push(dName(startD + groups + 2)); // kết thúc ở bậc 4 của nhóm cuối
  return mk(ns, fings.repeat(groups) + last, "e", 8, "w");

function bassLine(chart, beats = 4, set = "c") {

    if (i === chart.length - 1) return `${a[0]}/${beats === 4 ? "w" : "h."}:${a[1]}`;

  if (midiOn()) setMidiStatus("Đã kết nối: " + midi.names.join(", "), "ok");
  else setMidiStatus("Chưa thấy đàn. Cắm dây MIDI/USB và bật đàn lên.", "");
  updateMidiUI();
}
function onMidiMessage(e) {
  const [st, note, vel] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && vel > 0) midiNoteOn(note);
  else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) { midi.held.delete(note); redrawKeyboard(); }
}
function midiNoteOn(m) {
  midi.held.add(m);
  redrawKeyboard();
  const p = state.phase;
  if (p in PRAC) practicePress(m, true);
  else if (p === "note") midiAnswerNote(m);
  else if (p === "ear") midiAnswerEar(m);
  else if (p === "chord") midiAnswerChord();
}
function midiAnswerNote(m) {
  if (state.revealed) return;
  const it = state.notes[state.idx];
  if (!it) return;
  const target = midiOf(it.d, it.acc);
  const ok = m === target; // bấm trên đàn thì phải đúng chính xác phím (đúng cả quãng tám)
  const g = ok ? { li: it.d % 7, acc: it.acc, midi: m, ok: true } : { ...spellMidi(m, it.acc), midi: m, ok: false };
  answerNote(g);
}
function midiAnswerEar(m) {
  const e = state.ear;
  if (!e || e.revealed) return;
  const target = midiOf(e.d, e.acc);
  revealEar(m === target ? { li: e.d % 7, acc: e.acc, midi: m, ok: true } : { ...spellMidi(m, e.acc), midi: m, ok: false });
}
function midiAnswerChord() {
  const st = state.chord;
  if (!st || st.revealed) return;
  const pcs = new Set([...midi.held].map(mod12)), want = new Set(st.c.pcs);
  if (pcs.size < want.size) return; // chờ bấm đủ số nốt
  const ok = pcs.size === want.size && [...want].every(p => pcs.has(p));
  revealChord(ok ? st.choices.indexOf(st.c) : -1, [...midi.held].sort((a, b) => a - b));
}

// ===================== Sự kiện =====================
MODES.forEach(m => {
  const b = document.createElement("button");
  b.dataset.m = m.id;
  b.innerHTML = `<span class="ic ${m.music ? "music" : ""}">${m.ic}</span>${m.label}`;
  b.onclick = () => setMode(m.id);
  $("modes").appendChild(b);
});
const byMode = (sym, ear, note, chord) => () => (state.mode === "sym" ? sym : state.mode === "ear" ? ear : state.mode === "chord" ? chord : note)();
$("autoBtn").onclick = () => setAuto(!autoOn);
document.querySelectorAll("#noteClef button").forEach(b => b.onclick = () => setMode(b.dataset.v));
setupSeg("noteMax", state.noteMax, v => { state.noteMax = +v; lsSet("noteMax", state.noteMax); if (state.phase === "note") newNote(); });
$("timer").addEventListener("change", () => { state.tLimit = T_MAX; resetStats(); view(state.phase); if (state.phase === "note") newNote(); });
setAuto(autoOn);
$("nextBtn").onclick = () => state.phase in PRAC ? nextPiece() : byMode(newSymbol, newEar, newNote, newChord)();
$("soundBtn").onclick = () => state.phase in PRAC ? toggleDemo() : byMode(() => {}, playEar, playNotes, playChord)();
$("restartBtn").onclick = () => startPractice();
$("pieceSel").onchange = () => { state.pieceIdx[state.phase] = +$("pieceSel").value; lsSet("pracPiece", state.pieceIdx); $("pieceSel").blur(); startPractice(); };
["pracHint", "pracNames"].forEach(id => {
  const v = lsGet("opt_" + id, null);
  if (v !== null) $(id).checked = v;
  $(id).addEventListener("change", () => { lsSet("opt_" + id, $(id).checked); renderPractice(id === "pracNames"); });
});
$("kbd").addEventListener("pointerdown", e => {
  if (!(state.phase in PRAC)) return;
  const m = e.target.getAttribute && e.target.getAttribute("data-m");
  if (m == null) return;
  e.preventDefault();
  practicePress(+m, false);
});
buildAccSel();
initChordOpts();

// Ghi nhớ các tùy chọn
// Số dòng kẻ phụ (0–3, mặc định 2)
for (let i = 0; i <= LEDGER_MAX; i++) $("ledger").add(new Option(String(i), String(i)));
$("ledger").value = String(Math.min(LEDGER_MAX, Math.max(0, +lsGet("opt_ledgerN", 2) || 0)));
$("ledger").addEventListener("change", () => { lsSet("opt_ledgerN", +$("ledger").value); view(state.phase); if (state.phase === "note") newNote(); });
$("ottava").addEventListener("change", () => { if (state.phase === "note") renderNote(); });
$("acc").checked = !!lsGet("opt_accAll", (+lsGet("opt_accLevel", 0) || 0) > 0 || !!lsGet("opt_acc", false));
$("acc").addEventListener("change", () => lsSet("opt_accAll", $("acc").checked));
["autoSound", "timer", "ottava"].forEach(id => {
  const v = lsGet("opt_" + id, null);
  if (v !== null) $(id).checked = v;
  $(id).addEventListener("change", () => lsSet("opt_" + id, $(id).checked));
});
$("acc").addEventListener("change", () => {
  view(state.phase);
  if (state.phase === "note") newNote();
  else if (state.phase === "ear") newEar();
  else if (state.phase === "chord") newChord();
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), p = state.phase;
  if (p in PRAC) {
    if (e.target.tagName === "SELECT") e.target.blur(); // tránh gõ phím làm đổi bài đang chọn
    const two = state.prac && state.prac.lanes.length === 2;
    if (k === "enter" || k === "arrowright") { e.preventDefault(); nextPiece(); }
    else if (k === " ") { e.preventDefault(); toggleDemo(); }
    else if (two && (k in PC2_R || k in PC2_L)) {
      e.preventDefault();
      if (!e.repeat) practicePress(k in PC2_R ? pcBase(0) + PC2_R[k] : pcBase(1) + PC2_L[k], false);
    }
    else if (k === "r") startPractice();
    else if (k in PC_KEYS) { e.preventDefault(); if (!e.repeat) practicePress(pcBase() + PC_KEYS[k], false); }
    return;
  }
  const noteIdx = k >= "1" && k <= "7" ? +k - 1 : LETTER_KEY[k];
  if (p === "note" && accOn()) {
    const v = k === "-" || k === "_" ? -1 : k === "+" || k === "=" || k === "#" ? 1 : k === "0" ? 0 : null;
    if (v !== null) { e.preventDefault(); setAccSel(state.accSel === v ? 0 : v); return; }
  }
  if (p === "note" || p === "ear") {
    const reveal = p === "ear" ? revealEar : answerNote;
    if (k === " ") { e.preventDefault(); setAuto(!autoOn); }
    else if (k === "enter" || k === "arrowright") { e.preventDefault(); (p === "ear" ? newEar : newNote)(); }
    else if (k === "r") { p === "ear" ? playEar() : playNotes(); }
    else if (noteIdx !== undefined) reveal(pick(noteIdx));
  } else if (p === "sym") {
    if (k === " ") { e.preventDefault(); setAuto(!autoOn); }
    else if (k === "enter" || k === "arrowright") { e.preventDefault(); newSymbol(); }
    else if (k >= "1" && k <= "4") revealSym(+k - 1);
  } else if (p === "chord") {
    if (k === " ") { e.preventDefault(); setAuto(!autoOn); }
    else if (k === "enter" || k === "arrowright") { e.preventDefault(); newChord(); }
    else if (k === "r") playChord();
    else if (k >= "1" && k <= "4") revealChord(+k - 1);
  }
});

function rerender() {
  if (state.phase === "note") renderNote();
  else if (state.phase === "ear") renderEar();
  else if (state.phase === "sym") renderSym();
  else if (state.phase === "chord") renderChord();
  else if (state.phase in PRAC) renderPractice(true);
}

setMode("treble"); // luôn mở app ở chế độ Khóa Sol
$("midiBtn").onclick = () => connectMidi(false);
Object.entries(KB_SIZES).forEach(([k, v]) => $("kbSize").add(new Option(v.label, k, false, k === kbSize)));
$("kbSize").onchange = () => { kbSize = $("kbSize").value; lsSet("kbSize", kbSize); redrawKeyboard(); };
if (lsGet("midiOn", false)) connectMidi(true); // lần trước đã kết nối thì tự kết nối lại

// Tải font ký hiệu âm nhạc xong thì đo và vẽ lại cho chuẩn
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('40px "Noto Music"', "𝄞𝄢♯♭♮𝄪𝄫𝄻𝄼𝄽𝄾𝄿𝄴𝄐𝆏𝆐𝆑𝆮𝆯𝄋𝄌"),
  ]).catch(() => {}).then(() => { for (const k in inkCache) delete inkCache[k]; rerender(); });
}
</script>
